<!doctype html>
<html lang="sk" class="theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Kôňcerty – punk, ska a rock’n’roll vo Furmanke v Námestove. Všetky naše odkazy na jednom mieste.">
  <title>KÔŇCERTY – všetky odkazy</title>
  <link rel="icon" type="image/png" href="images/avatar.png">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/brands.css">
  <style>
    :root { color-scheme: dark; --orange: #f28e1c; --ink: #080808; --panel: #171717; --line: #333; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; background: var(--ink) !important; }
    body {
      margin: 0; color: #f5f5f5; font-family: Bahnschrift, "Arial Narrow", Arial, sans-serif;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(242,142,28,.13), transparent 48%),
                        repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 1px, transparent 1px 5px) !important;
    }
    .container { width: 100%; min-height: 100vh; display: flex; justify-content: center; padding: 42px 18px 30px; }
    .column { width: 100%; max-width: 480px; }
    main { width: 100%; text-align: center; }
    .brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 76px; height: 76px; margin: 0 auto 18px; border: 2px solid var(--orange); border-radius: 50%; color: var(--orange); font-size: 37px; font-weight: 900; letter-spacing: -5px; text-indent: -5px; transform: rotate(-8deg); box-shadow: 0 0 28px rgba(242,142,28,.16); }
    h1 { margin: 0; color: #fff; font-family: Bahnschrift, "Arial Narrow", Impact, sans-serif; font-size: clamp(38px, 10vw, 54px); line-height: .98; font-weight: 900; letter-spacing: 1px; }
    h1 span { color: var(--orange); }
    .tagline { margin: 13px 0 7px; color: #c7c7c7; font-size: 13px; font-weight: 700; letter-spacing: 3px; }
    .location { margin: 0 0 28px; color: #777; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
    .button-stack { display: flex; flex-direction: column; gap: 11px; width: 100%; }
    .button-stack .button {
      display: flex; align-items: center; justify-content: center; gap: 13px; width: 100%; min-height: 57px;
      padding: 13px 18px; border: 1px solid #383838; border-radius: 7px; background: linear-gradient(110deg, #1d1d1d, #121212);
      color: #f5f5f5 !important; font-size: 15px; font-weight: 800; letter-spacing: 1.2px; text-decoration: none;
      text-transform: uppercase; box-shadow: 0 4px 0 #050505; transition: transform .16s ease, border-color .16s ease, background .16s ease, color .16s ease;
    }
    .button-stack .button:hover, .button-stack .button:focus-visible { transform: translateY(-2px); border-color: var(--orange); background: #24201b; color: var(--orange) !important; outline: none; }
    .button-stack .button-primary { border-color: var(--orange); background: var(--orange); color: #111 !important; box-shadow: 0 4px 0 #8c4c0b; }
    .button-stack .button-primary:hover, .button-stack .button-primary:focus-visible { background: #ffa83e; color: #111 !important; }
    .button-stack .icon { width: 23px; height: 23px; object-fit: contain; margin: 0; }
    .section-label { margin: 26px 0 12px; color: var(--orange); font-size: 11px; font-weight: 800; letter-spacing: 3px; text-align: left; }
    footer { margin-top: 30px; color: #686868; text-align: center; font-size: 11px; letter-spacing: 1.5px; }
    footer strong { color: #aaa; }
    @media (max-width: 420px) { .container { padding-top: 30px; } .button-stack .button { min-height: 54px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="column">
      <main>
        <div class="brand-mark" aria-hidden="true">KŇ</div>
        <h1>KÔŇ<span>CERTY</span></h1>
        <p class="tagline">PUNK · SKA · ROCK’N’ROLL</p>
        <p class="location">Furmanka · Námestovo</p>

        <nav class="button-stack" aria-label="Odkazy Kôňcertov">
          <a class="button button-primary" href="https://koncerty-furmanka.github.io/koncerty/" target="_blank" rel="noopener noreferrer">
            <img class="icon" src="images/icons/generic-homepage.svg" alt=""> NAŠA APLIKÁCIA
          </a>
          <p class="section-label">NÁJDEŠ NÁS AJ TU</p>
          <a class="button button-faceb" href="https://www.facebook.com/k0ncerty" target="_blank" rel="noopener noreferrer">
            <img class="icon" src="images/icons/facebook.svg" alt=""> FACEBOOK
          </a>
          <a class="button button-instagram" href="https://www.instagram.com/k0ncerty/" target="_blank" rel="noopener noreferrer">
            <img class="icon" src="images/icons/instagram.svg" alt=""> INSTAGRAM
          </a>
          <a class="button button-spotify" href="https://open.spotify.com/playlist/6wSvTTbk3nTBMpEmGoXIw5" target="_blank" rel="noopener noreferrer">
            <img class="icon" src="images/icons/spotify.svg" alt=""> SPOTIFY PLAYLIST
          </a>
          <a class="button button-yt" href="https://youtube.com/@koncerty2022" target="_blank" rel="noopener noreferrer">
            <img class="icon" src="images/icons/youtube.svg" alt=""> YOUTUBE
          </a>
          <a class="button button-tiktok" href="https://www.tiktok.com/@k0ncerty_" target="_blank" rel="noopener noreferrer">
            <img class="icon" src="images/icons/tiktok.svg" alt=""> TIKTOK
          </a>
        </nav>
      </main>
      <footer><strong>KÔŇCERTY</strong> · FURMANKA · NÁMESTOVO</footer>
    </div>
  </div>
</body>
</html>
