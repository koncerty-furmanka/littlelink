<!doctype html>
<html lang="sk" class="theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090807">
  <meta name="description" content="Kôňcerty – punk, ska a rock’n’roll vo Furmanke v Námestove. Všetky naše odkazy na jednom mieste.">
  <title>KÔŇCERTY – oficiálne odkazy</title>
  <link rel="icon" type="image/png" href="images/avatar.png">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/brands.css">
  <style>
    :root {
      color-scheme: dark;
      --orange: #f28e1c;
      --orange-bright: #ff9d28;
      --bg: #090807;
      --panel: #171615;
      --line: rgba(255,255,255,.13);
      --muted: #92908c;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; background: var(--bg) !important; }
    body {
      margin: 0;
      color: #f5f3ef;
      font-family: Bahnschrift, "Arial Narrow", Arial, sans-serif;
      background: #0b0a09 !important;
    }
    .container {
      width: 100%; min-height: 100vh; display: flex; justify-content: center;
      padding: 18px 18px 28px;
    }
    .column { width: 100%; max-width: 470px; }
    main { width: 100%; text-align: center; }
    .brand-logo {
      display: block;
      width: min(100%, 300px);
      height: auto;
      margin: 0 auto 18px;
      object-fit: contain;
      filter: drop-shadow(0 5px 18px rgba(0,0,0,.35));
    }
    .location {
      display: block; width: fit-content; margin: 0 auto 22px; padding: 3px 0 0;
      color: #a7a19a; border-top: 1px solid rgba(242,142,28,.32);
      border-bottom: 1px solid rgba(242,142,28,.32);
      font-size: 11px; letter-spacing: 2.4px; text-transform: uppercase;
    }
    .button-stack { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
    .button-stack .button {
      position: relative; display: flex; align-items: center; justify-content: center;
      gap: 13px; width: 92%; min-height: 52px; padding: 11px 18px;
      border: 1px solid var(--line); border-radius: 3px;
      background: #171615;
      color: #f7f5f1 !important; font-size: 15px; font-weight: 850;
      letter-spacing: 1.1px; text-decoration: none; text-transform: uppercase;
      box-shadow: 0 2px 0 #000;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .button-stack .button:hover, .button-stack .button:focus-visible {
      transform: translateY(-2px); border-color: var(--orange);
      background: #211b15;
      color: var(--orange-bright) !important;
      box-shadow: 0 3px 0 #000;
      outline: none;
    }
    .button-stack .button-primary {
      min-height: 58px; margin-bottom: 0; border: 1px solid var(--orange);
      background: #f28e1c;
      color: #111 !important; box-shadow: 0 3px 0 #8b4a0a;
    }
    .button-stack .button-primary:hover, .button-stack .button-primary:focus-visible {
      background: #ffa12e; color: #111 !important;
      box-shadow: 0 4px 0 #8b4a0a;
    }
    .button-stack .icon {
      display: block; flex: 0 0 24px; width: 24px; height: 24px;
      object-fit: contain; margin: 0; filter: brightness(0) invert(1);
    }
     .button-stack .button-primary .icon { filter: none; }
    .button-stack .button-primary .app-mark {
      width: 28px; height: 42px; flex-basis: 28px; object-fit: contain;
    }
    /* Keep each social network's recognizable brand colours. */
    .button-stack .social-link .icon {
      filter: none !important;
      width: 21px; height: 21px; flex-basis: 21px;
      object-fit: contain;
    }
    .button-stack .social-link { gap: 14px; }
    .button-stack .social-link:hover .icon { transform: scale(1.08); }
    .button-stack .social-link .icon { transition: transform .18s ease; }
    .section-label {
      display: block; margin: 0;
      color: var(--orange); font-size: 12px; font-weight: 900;
      letter-spacing: 2.5px; text-align: center;
    }
    .section-label::after { content: none; }
    footer {
      margin-top: 28px; color: #77716a; text-align: center;
      font-size: 10px; letter-spacing: 1.8px;
    }
    footer strong { color: #b5ada3; }
    @media (max-width: 420px) {
      .container { padding: 14px 17px 24px; }
      .button-stack .button { width: 94%; min-height: 50px; font-size: 14px; }
      .button-stack .button-primary { min-height: 55px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
